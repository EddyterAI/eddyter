title: "[Showcase] "
body:
  - type: markdown
    attributes:
      value: |
        Built something with Eddyter? We'd love to see it.
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      placeholder: https://
  - type: textarea
    id: description
    attributes:
      label: What did you build, and how do you use Eddyter in it?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here.
  - type: checkboxes
    id: feature
    attributes:
      label: Permission
      options:
        - label: Eddyter may feature this project (name, link and screenshots) on its website, README and social media.
